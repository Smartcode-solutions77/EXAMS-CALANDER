<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam calendar - October 2026</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--text:#1f1e1d;--muted:#5f5e5a;--line:#d9d6cc;--today:#185fa5;--tomorrow:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#1f1e1d;--card:#2a2927;--text:#f1efe8;--muted:#b4b2a9;--line:#444441;--today:#85b7eb;--tomorrow:#f09595}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
main{max-width:1000px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:24px;font-weight:600;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.lg{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.fb{font:inherit;font-size:14px;font-weight:600;padding:6px 16px;border-radius:999px;cursor:pointer;border:3px solid transparent}
.fb:focus-visible{outline:2px solid var(--text);outline-offset:2px}
#count{font-size:14px;color:var(--muted);margin:0 0 12px}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dh{font-size:13px;font-weight:600;color:var(--muted);text-align:center;padding:4px 0}
.day{min-height:120px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--card);display:flex;flex-direction:column;gap:6px}
.num{font-size:14px;font-weight:600;color:var(--muted)}
.ev{border-radius:6px;padding:6px 8px;font-size:13px;line-height:1.35}
.ev b{display:block;font-weight:600}
.g7{background:#E6F1FB;color:#0C447C}
.g9{background:#FBEAF0;color:#72243E}
.g10{background:#EEEDFE;color:#3C3489}
.g11{background:#FAEEDA;color:#633806}
.g12{background:#E1F5EE;color:#085041}
.g6{background:#FAECE7;color:#712B13}
.g8{background:#EAF3DE;color:#27500A}
.note{font-size:13px;color:var(--muted);margin:14px 0 0}
</style>
</head>
<body>
<main>
<h1>Exam calendar</h1>
<p class="sub">October 2026. Choose a grade to see only its exams.</p>
<div class="lg" id="filters"></div>
<p id="count"></p>
<div style="overflow-x:auto"><div class="cal" id="cal" style="min-width:760px"></div></div>
</main>
<script>
var exams=[
{d:22,g:11,n:'Statistics',t:'8:50–9:45 AM'},
{d:22,g:11,n:'Accounting',t:'8:50–9:45 AM'},
{d:22,g:11,n:'Global Politics',t:'8:50–9:45 AM'},
{d:22,g:12,n:'Media & Journalism',t:'10:40–11:35 AM'},
{d:22,g:12,n:'Environmental Sc',t:'10:40–11:35 AM'},
{d:22,g:10,n:'Computer',t:'11:30 AM–12:20 PM'},
{d:25,g:6,n:'English - Ziad & Farid',t:'8:00–10:30 AM',l:'Flex 6'},
{d:25,g:9,n:'Math',t:'8:00–10:20 AM'},
{d:25,g:6,n:'English',t:'8:01–10:20 AM'},
{d:25,g:10,n:'Math',t:'10:30 AM–12:35 PM'},
{d:25,g:11,n:'Math',t:'10:30 AM–12:40 PM'},
{d:25,g:12,n:'Math',t:'10:30 AM–12:30 PM'},
{d:26,g:7,n:'English - Eyad Haitham',t:'8:00–10:00 AM',l:'Flex 7'},
{d:26,g:7,n:'English',t:'8:00–9:35 AM'},
{d:26,g:8,n:'English - xxxx',t:'8:00–10:00 AM',l:'Flex 8'},
{d:26,g:8,n:'English',t:'8:00–9:35 AM'},
{d:26,g:9,n:'English - Yassin Shafie',t:'8:00–10:31 AM',l:'Flex 9'},
{d:26,g:9,n:'English',t:'8:00–10:10 AM'},
{d:26,g:10,n:'English',t:'10:30 AM–12:35 PM'},
{d:26,g:11,n:'English',t:'10:30 AM–12:35 PM'},
{d:26,g:12,n:'English',t:'10:30 AM–12:35 PM'},
{d:27,g:7,n:'Science',t:'8:00–9:05 AM'},
{d:27,g:9,n:'Science',t:'8:00–9:05 AM'},
{d:27,g:10,n:'Biology',t:'10:30 AM–12:35 PM'},
{d:27,g:11,n:'Physics',t:'10:30 AM–12:05 PM'},
{d:28,g:10,n:'US History',t:'10:30 AM–12:35 PM'},
{d:28,g:11,n:'Economics',t:'10:30 AM–12:05 PM'},
{d:28,g:12,n:'Business',t:'10:30 AM–12:05 PM'},
{d:29,g:6,n:'French',t:'8:00–9:05 AM'},
{d:29,g:11,n:'French',t:'10:30 AM–12:04 PM'},
{d:29,g:12,n:'Adv Biology',t:'10:30 AM–12:35 PM'}
];
var days=[18,19,20,21,22,25,26,27,28,29];
var weekday={18:'Sun',19:'Mon',20:'Tue',21:'Wed',22:'Thu',25:'Sun',26:'Mon',27:'Tue',28:'Wed',29:'Thu'};
var colors={8:['#C0DD97','#173404','#3B6D11'],6:['#F5C4B3','#4A1B0C','#993C1D'],7:['#B5D4F4','#042C53','#185FA5'],9:['#F4C0D1','#4B1528','#993556'],10:['#CECBF6','#26215C','#534AB7'],11:['#FAC775','#412402','#854F0B'],12:['#9FE1CB','#04342C','#0F6E56'],all:['#444441','#F1EFE8','#2C2C2A']};
var sel='all';
var grades=['all',6,7,8,9,10,11,12];
function esc(s){return s.replace(/&/g,'&amp;');}
function render(){
var f=document.getElementById('filters');
f.innerHTML='';
grades.forEach(function(g){
var b=document.createElement('button');
var c=colors[g];
b.className='fb';
b.textContent=g==='all'?'All grades':'Grade '+g;
b.style.background=c[0];
b.style.color=c[1];
b.style.borderColor=(sel===g)?c[2]:'transparent';
b.setAttribute('aria-pressed',sel===g);
b.onclick=function(){sel=g;render();};
f.appendChild(b);
});
var shown=exams.filter(function(e){return sel==='all'||e.g===sel;});
document.getElementById('count').textContent='Showing '+shown.length+' of '+exams.length+' exams';
var h='';
['Sun','Mon','Tue','Wed','Thu'].forEach(function(x){h+='<div class="dh">'+x+'</div>';});
days.forEach(function(d){
var style='',label=weekday[d]+', Oct '+d,ncol='';
if(d===21){style=' style="border:2px solid var(--today)"';label+=' · today';ncol=' style="color:var(--today)"';}
if(d===22){style=' style="border:2px solid var(--tomorrow)"';label+=' · tomorrow';ncol=' style="color:var(--tomorrow)"';}
h+='<div class="day"'+style+'><div class="num"'+ncol+'>'+label+'</div>';
shown.filter(function(e){return e.d===d;}).forEach(function(e){
h+='<div class="ev g'+e.g+'"><b>'+esc(e.n)+'</b>'+(e.l||'Grade '+e.g)+' · '+e.t+'</div>';
});
h+='</div>';
});
document.getElementById('cal').innerHTML=h;
}
render();
</script>
</body>
</html>
